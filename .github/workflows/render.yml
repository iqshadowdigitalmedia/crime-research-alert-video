name: Create Hindi MP4 Video

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-lohit-deva libraqm0 libfribidi0 libharfbuzz0b

      - name: Install Python libraries
        run: pip install -r requirements.txt

      - name: Create MP4
        run: python render.py

      - name: Save MP4
        uses: actions/upload-artifact@v4
        with:
          name: ncrib-awareness-mp4
          path: output/ncrib-awareness.mp4
          if-no-files-found: error
