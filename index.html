<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCRIB Foundation Awareness Documentary</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b14;color:white;font-family:Arial,sans-serif}
header{padding:10px 16px;background:#101e30;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
button,select{padding:10px;background:#18344a;color:white;border:1px solid #527187;border-radius:7px;cursor:pointer}
#stage{width:min(100%,1280px);aspect-ratio:16/9;margin:auto;position:relative;overflow:hidden;background:#12253a}
#bg{position:absolute;inset:0;background-size:cover;background-position:center;animation:zoom 18s linear infinite}
#shade{position:absolute;inset:0;background:linear-gradient(90deg,#04101aee 0%,#04101acc 52%,#04101a20 100%),linear-gradient(0deg,#04101aaa,transparent 50%)}
#copy{position:absolute;z-index:2;left:5%;top:12%;width:64%;animation:enter .7s ease}
#tag{color:#50f0d1;letter-spacing:2px;font-weight:bold;font-size:clamp(9px,1.1vw,15px)}
h1{font-size:clamp(24px,4.7vw,60px);line-height:1.12;margin:16px 0}
h2{font-size:clamp(15px,2.2vw,28px);color:#ffd66b;margin:8px 0 16px}
p,li{font-size:clamp(11px,1.45vw,19px);line-height:1.6}
ul{padding-left:22px}
#person{position:absolute;right:3%;bottom:-2%;width:31%;height:84%;z-index:1;transform-origin:bottom center;animation:breathe 3s infinite ease-in-out}
#person.talking{animation:talk .24s infinite alternate}
svg{width:100%;height:100%;filter:drop-shadow(0 0 15px #0008)}
#caption{max-width:1100px;margin:auto;padding:12px 18px;text-align:center;min-height:55px;font-size:16px;line-height:1.5}
#controls{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding:8px}
#progress{width:min(40%,400px)}
#notice{text-align:center;color:#9eb4c5;font-size:12px;padding:10px}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.15)}}
@keyframes enter{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
@keyframes breathe{50%{transform:translateY(-5px)}}
@keyframes talk{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@media(max-width:500px){#copy{width:70%;top:8%}#person{width:33%;right:0;height:70%}p,li{line-height:1.4}}
</style>
</head>
<body>
<header>
<strong style="color:#50f0d1">CRIME RESEARCH • PUBLIC AWARENESS</strong>
<div>
<select id="voices" aria-label="Hindi voice"></select>
<button id="voiceBtn">🔊 Voice ON</button>
<button id="playBtn">⏸ Pause</button>
</div>
</header>

<div style="padding:10px">
<div id="stage">
<div id="bg"></div><div id="shade"></div>
<div id="copy"></div>

<div id="person">
<svg viewBox="0 0 300 500" xmlns="http://www.w3.org/2000/svg">
<ellipse cx="150" cy="480" rx="100" ry="14" fill="#0008"/>
<path d="M65 500 L78 335 Q100 290 150 290 Q200 290 222 335 L235 500Z" fill="#18364c" stroke="#58829b" stroke-width="3"/>
<path d="M125 295 L150 350 L175 295 L165 280 L135 280Z" fill="#f0f3f5"/>
<path d="M143 307 L150 341 L158 307 L150 298Z" fill="#35d4bd"/>
<rect x="132" y="250" width="36" height="48" rx="12" fill="#b97653"/>
<ellipse cx="150" cy="185" rx="67" ry="82" fill="#c98b68"/>
<path d="M82 183 Q63 90 143 88 Q222 84 219 175 L201 139 Q157 151 102 133Z" fill="#202630"/>
<path d="M100 170 Q115 160 135 171 M166 171 Q187 160 202 170" fill="none" stroke="#30231f" stroke-width="5" stroke-linecap="round"/>
<ellipse cx="123" cy="187" rx="5" ry="7" fill="#151920"/>
<ellipse cx="177" cy="187" rx="5" ry="7" fill="#151920"/>
<path d="M150 188 L143 210 L153 211" fill="none" stroke="#9d624b" stroke-width="3"/>
<ellipse cx="150" cy="226" rx="12" ry="4" fill="#713c34" id="mouth"/>
<path d="M95 336 L55 395 L86 417 L125 365Z" fill="#18364c" stroke="#58829b" stroke-width="3"/>
<path d="M205 336 L245 395 L214 417 L175 365Z" fill="#18364c" stroke="#58829b" stroke-width="3"/>
<circle cx="150" cy="366" r="9" fill="#ffd66b"/>
</svg>
</div>
</div>
</div>

<div id="caption" aria-live="polite"></div>
<div id="controls">
<button id="prev">◀ पिछला</button>
<input id="progress" type="range" min="0" max="10" value="0">
<button id="next">अगला ▶</button>
<button id="restart">↻ शुरू से</button>
</div>
<div id="notice">16:9 Landscape • Hindi narration • Browser voice required • Internet required for background images</div>

<script>
const article="https://researchcrimeawareness.blogspot.com/2026/09/ncrib-foundation-review.html";

const data=[
{tag:"PUBLIC AWARENESS DOCUMENTARY",title:"NCRIB FOUNDATION",sub:"दावे, दस्तावेज़ और सत्यापन",text:"इस वीडियो का उद्देश्य सार्वजनिक जानकारी को समझना और लोगों को जागरूक करना है। किसी भी संस्था के बारे में निष्कर्ष निकालने से पहले प्रमाण और मूल स्रोत जाँचना आवश्यक है।",img:"photo-1454165804606-c3d57bc86b40",points:["सार्वजनिक रिकॉर्ड","स्वतंत्र सत्यापन","जागरूक नागरिक"]},
{tag:"CHAPTER 01 • COMPANY RECORDS",title:"कंपनी की पहचान",sub:"नाम, CIN और वर्तमान स्थिति",text:"कंपनी की कानूनी पहचान के लिए Ministry of Corporate Affairs के मूल रिकॉर्ड देखें। नाम, CIN, पंजीकरण की तारीख और वर्तमान स्थिति को रिकॉर्ड से मिलाएँ।",img:"photo-1554224155-6726b3ff858f",points:["नाम और CIN मिलाएँ","पंजीकरण रिकॉर्ड जाँचें","दस्तावेज़ की तारीख नोट करें"]},
{tag:"CHAPTER 02 • DIRECTORS",title:"निदेशक और संबंधित संस्थाएँ",sub:"समान विवरण अपने-आप आरोप नहीं",text:"यदि सार्वजनिक रिकॉर्ड में निदेशक या पता साझा दिखाई देता है, तो केवल वही तथ्य बताएँ जिसकी पुष्टि दस्तावेज़ से होती है। समानता अपने-आप किसी गलत काम का प्रमाण नहीं है।",img:"photo-1521737711867-e3b97375f902",points:["मूल रिकॉर्ड देखें","संबंध का आधार बताएँ","बिना प्रमाण आरोप न लगाएँ"]},
{tag:"CHAPTER 03 • WEBSITE HISTORY",title:"वेबसाइट का इतिहास",sub:"पुराने snapshots की जाँच",text:"Wayback Machine पर उपलब्ध snapshots किसी खास तारीख पर सुरक्षित किए गए पेज दिखा सकते हैं। Snapshot की तारीख और URL नोट करें। रिकॉर्ड न मिलने से यह निश्चित नहीं होता कि वेबसाइट मौजूद नहीं थी।",img:"photo-1461749280684-dccba630e2f6",points:["तारीख जाँचें","URL मिलाएँ","सीमाओं को स्पष्ट रखें"]},
{tag:"CHAPTER 04 • NGO DARPAN",title:"NGO Darpan क्या बताता है?",sub:"लिस्टिंग और सरकारी अधिकार अलग हैं",text:"किसी पोर्टल पर संगठन की जानकारी दर्ज होना अपने-आप उसे सरकारी विभाग या जाँच एजेंसी का अधिकार नहीं देता। किसी विशेष अधिकार की पुष्टि कानून या आधिकारिक आदेश से करनी चाहिए।",img:"photo-1589829545856-d10d557cf95f",points:["पोर्टल का विवरण जाँचें","कानूनी अधिकार अलग से जाँचें","सरकारी आदेश खोजें"]},
{tag:"CHAPTER 05 • RECRUITMENT",title:"भर्ती के दावों की जाँच",sub:"आवेदन से पहले सत्यापन",text:"भर्ती के विज्ञापन में नियोक्ता, वेतन, स्थान, काम और नियुक्ति प्रक्रिया की जानकारी जाँचें। बड़ी संख्या में पदों का दावा अपने-आप स्वीकृत रिक्तियों का प्रमाण नहीं होता।",img:"photo-1521791136064-7986c2920216",points:["आधिकारिक आदेश माँगें","वेतन लिखित में लें","संदिग्ध भुगतान से सावधान रहें"]},
{tag:"CHAPTER 06 • PROJECTS",title:"परियोजनाएँ और मिशन",sub:"दावा और क्रियान्वयन",text:"किसी परियोजना की पुष्टि के लिए दिनांकित रिपोर्ट, स्थान, स्वतंत्र प्रमाण और जहाँ लागू हो आधिकारिक दस्तावेज़ देखें। वेबसाइट का विवरण अकेले वास्तविक क्रियान्वयन साबित नहीं करता।",img:"photo-1488521787991-ed7bbaae773c",points:["स्थान और तारीख","परियोजना रिपोर्ट","स्वतंत्र प्रमाण"]},
{tag:"CHAPTER 07 • PUBLIC CHECKLIST",title:"जनता की जाँच सूची",sub:"सुरक्षित निर्णय लेने के कदम",text:"किसी नौकरी या संस्था से जुड़ने से पहले रिकॉर्ड और लिखित शर्तें जाँचें। दस्तावेज़ सुरक्षित रखें और समस्या होने पर उचित आधिकारिक माध्यम से सहायता लें।",img:"photo-1450101499163-c8848c66ca85",points:["MCA: mca.gov.in","NGO Darpan: ngodarpan.gov.in","वेबसाइट आर्काइव: web.archive.org","Cybercrime: cybercrime.gov.in"]},
{tag:"FINAL • AWARENESS",title:"जागरूक रहें",sub:"प्रमाण देखें • सवाल पूछें • सुरक्षित रहें",text:"यह सार्वजनिक जानकारी की समीक्षा और स्वतंत्र सत्यापन को प्रोत्साहित करने वाला वीडियो है। अपुष्ट बातों को तथ्य की तरह प्रस्तुत न करें। अंतिम निष्कर्ष विश्वसनीय प्रमाण और मूल दस्तावेज़ों पर आधारित होना चाहिए।",img:"photo-1497366754035-f200968a6e72",points:["तथ्य और दावा अलग रखें","स्रोत सुरक्षित रखें","जिम्मेदारी से जानकारी साझा करें"]}
];

let i=0,playing=true,voiceOn=true,timer=null;
const $=id=>document.getElementById(id);
const imageURL=id=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=1600&q=85`;
const safe=t=>String(t||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function loadVoices(){
const list=speechSynthesis.getVoices();
$("voices").innerHTML="";
list.forEach((v,n)=>{
const o=document.createElement("option");
o.value=n;o.textContent=v.name+" ("+v.lang+")";
$("voices").appendChild(o);
});
const hi=list.findIndex(v=>v.lang.toLowerCase().startsWith("hi"));
if(hi>=0)$("voices").value=hi;
}
if("speechSynthesis"in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}

function stopTalking(){
if("speechSynthesis"in window)speechSynthesis.cancel();
$("person").classList.remove("talking");
$("mouth").setAttribute("ry","4");
}
function narrate(s){
stopTalking();
if(!voiceOn||!("speechSynthesis"in window))return;
const u=new SpeechSynthesisUtterance([s.title,s.sub,s.text,(s.points||[]).join("। ")].join("। "));
u.lang="hi-IN";u.rate=.88;u.pitch=.85;
const v=speechSynthesis.getVoices()[Number($("voices").value)];
if(v){u.voice=v;u.lang=v.lang;}
u.onstart=()=>{$("person").classList.add("talking");$("mouth").setAttribute("ry","9");};
u.onend=()=>{$("person").classList.remove("talking");$("mouth").setAttribute("ry","4");};
speechSynthesis.speak(u);
}
function render(){
const s=data[i];stopTalking();
$("bg").style.backgroundImage=`url("${imageURL(s.img)}")`;
$("copy").innerHTML=`<div id="tag">${safe(s.tag)}</div><h1>${safe(s.title)}</h1><h2>${safe(s.sub)}</h2><p>${safe(s.text)}</p><ul>${s.points.map(p=>`<li>${safe(p)}</li>`).join("")}</ul>`;
$("caption").textContent=s.text;
$("progress").max=data.length-1;$("progress").value=i;
narrate(s);
}
function go(n){i=(i+n+data.length)%data.length;render();}
$("prev").onclick=()=>go(-1);
$("next").onclick=()=>go(1);
$("restart").onclick=()=>{i=0;render();};
$("progress").oninput=()=>{i=Number($("progress").value);render();};
$("playBtn").onclick=()=>{
playing=!playing;
$("playBtn").textContent=playing?"⏸ Pause":"▶ Play";
if(!playing)stopTalking();else narrate(data[i]);
};
$("voiceBtn").onclick=()=>{
voiceOn=!voiceOn;
$("voiceBtn").textContent=voiceOn?"🔊 Voice ON":"🔇 Voice OFF";
if(voiceOn)narrate(data[i]);else stopTalking();
};
$("voices").onchange=()=>{if(playing)narrate(data[i]);};
render();
</script>
</body>
</html>
