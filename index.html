<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCRIB Foundation Review | Hindi Video</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#06111f;color:#f5f7fb;font-family:Arial,"Noto Sans Devanagari",sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:70px 22px 85px;background:radial-gradient(ellipse at top right,#16445a,transparent 50%),linear-gradient(140deg,#06111f,#102339)}
.scene{width:min(100%,1000px);animation:show .6s ease}
.kicker{color:#5eead4;font-size:14px;font-weight:bold;letter-spacing:2px}
h1{font-size:clamp(36px,6vw,70px);line-height:1.12;margin:22px 0}
h2{font-size:clamp(24px,4vw,42px);color:#5eead4;line-height:1.25}
p,li{font-size:clamp(18px,2.2vw,25px);line-height:1.65;color:#d1deeb}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:24px}
.card{padding:22px;border:1px solid #31516a;border-radius:16px;background:#10243a}
.card b{display:block;color:#5eead4;font-size:22px;margin-bottom:10px}
.card span{font-size:18px;line-height:1.55;color:#d1deeb}
.note{margin-top:22px;padding:16px;border-left:4px solid #fbbf24;background:#2b271a;line-height:1.6;color:#ffedbb}
.tags span{display:inline-block;border:1px solid #49657c;border-radius:30px;padding:8px 12px;margin:5px}
.sources a{display:block;color:#5eead4;overflow-wrap:anywhere;margin:12px 0}
.controls{position:fixed;top:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
button{background:#15314b;color:white;border:1px solid #53718a;border-radius:9px;padding:10px;cursor:pointer}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#06111f;padding:12px 18px;display:flex;gap:12px;align-items:center}
.track{height:5px;background:#24384c;flex:1;border-radius:10px;overflow:hidden}
#bar{height:100%;width:0;background:#5eead4}
#count{font-size:13px;color:#d1deeb}
@keyframes show{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@media(max-width:600px){.cards{grid-template-columns:1fr}.card{padding:15px}.controls{left:8px;right:8px;justify-content:center}.stage{padding-top:90px}.card b{font-size:20px}}
</style>
</head>
<body>
<div class="controls">
<button id="prev">◀ पीछे</button>
<button id="play">⏸ रोकें</button>
<button id="next">आगे ▶</button>
<button id="restart">↻ शुरू</button>
</div>
<main class="stage"><section id="scene" class="scene"></section></main>
<div class="bottom"><div class="track"><div id="bar"></div></div><span id="count">1/10</span></div>

<script>
const ARTICLE="https://researchcrimeawareness.blogspot.com/2026/09/ncrib-foundation-review.html";

const scenes=[
{
time:15,k:"PUBLIC INFORMATION REPORT",
title:"NCRIB Foundation Review",
sub:"दावों को नहीं, प्रमाणों को परखें",
body:"इस वीडियो में संस्था से संबंधित सार्वजनिक जानकारी, वेबसाइट पर किए गए दावे और स्वतंत्र सत्यापन के तरीकों को समझाया गया है। उद्देश्य जागरूकता है, किसी व्यक्ति या संस्था के विरुद्ध अप्रमाणित आरोप लगाना नहीं।",
tags:["हिंदी एक्सप्लेनर","Public records","Fact checking"]
},
{
time:17,k:"01 — परिचय",
title:"यह समीक्षा क्यों जरूरी है?",
sub:"रजिस्ट्रेशन, वेबसाइट और अधिकार अलग-अलग बातें हैं",
cards:[
["रजिस्ट्रेशन","कानूनी इकाई का विवरण आधिकारिक रिकॉर्ड से जाँचें।"],
["वेबसाइट","वेबसाइट पर लिखा दावा अपने-आप स्वतंत्र प्रमाण नहीं है।"],
["सत्यापन","दस्तावेज़, तारीख और मूल स्रोत को आपस में मिलाएँ।"]
]
},
{
time:20,k:"02 — कंपनी रिकॉर्ड",
title:"आधिकारिक रिकॉर्ड की जाँच करें",
sub:"कंपनी की पहचान के लिए MCA पोर्टल देखें",
cards:[
["कानूनी नाम","कंपनी का नाम और CIN मूल रिकॉर्ड से मिलाएँ।"],
["स्थिति","वर्तमान कंपनी स्थिति और incorporation date जाँचें।"],
["निदेशक","निदेशकों और पते में हुए बदलाव देखें।"],
["दस्तावेज़","रिकॉर्ड की तारीख और डाउनलोड किए गए प्रमाण सुरक्षित रखें।"]
],
note:"प्रकाशित करने से पहले सभी कंपनी विवरण Ministry of Corporate Affairs के मूल रिकॉर्ड से सत्यापित करें।"
},
{
time:18,k:"03 — स्रोतों की जाँच",
title:"हर स्रोत की अपनी सीमा है",
cards:[
["आधिकारिक रिकॉर्ड","कानूनी विवरण के सत्यापन में उपयोगी।"],
["संस्था की वेबसाइट","संस्था के अपने दावे और घोषणाएँ दिखाती है।"],
["वेबसाइट आर्काइव","किसी तारीख पर सुरक्षित किए गए पेज की झलक दिखाता है।"],
["सावधानी","एक स्क्रीनशॉट से मालिकाना हक या गलत काम साबित नहीं होता।"]
]
},
{
time:18,k:"04 — NGO Darpan",
title:"लिस्टिंग का अर्थ समझें",
sub:"पोर्टल पर विवरण स्वयं सत्यापित करें",
body:"NGO Darpan पर दर्ज होना अपने-आप किसी संस्था को सरकारी विभाग, पुलिस इकाई या जाँच एजेंसी नहीं बनाता। किसी विशेष अधिकार के दावे की पुष्टि संबंधित कानून, सरकारी आदेश या आधिकारिक अधिसूचना से करें।",
note:"पोर्टल पर उपलब्ध रिकॉर्ड और किसी संस्था द्वारा किए गए दावों को अलग-अलग प्रस्तुत करें।"
},
{
time:20,k:"05 — भर्ती और अवसर",
title:"Vacancy के दावे कैसे जाँचें?",
cards:[
["नियोक्ता","कौन नियुक्त कर रहा है और कानूनी जिम्मेदारी किसकी है?"],
["वेतन और काम","वेतन, स्थान, काम और अवधि लिखित में माँगें।"],
["आधिकारिक आदेश","भर्ती विज्ञापन या अधिकृत आदेश सत्यापित करें।"],
["भुगतान","भर्ती शुल्क या डिपॉजिट की माँग पर सावधानी बरतें।"]
],
note:"वेबसाइट पर प्रकाशित भर्ती संख्या को स्वतंत्र पुष्टि के बिना सत्यापित रिक्तियों की संख्या न बताएँ।"
},
{
time:18,k:"06 — वेबसाइट इतिहास",
title:"पुराने snapshots क्या बताते हैं?",
sub:"तारीख और URL के साथ तुलना करें",
body:"Wayback Machine के snapshots अलग-अलग समय पर उपलब्ध वेबसाइट सामग्री दिखा सकते हैं। पेज की सामग्री, URL और capture date को नोट करें। किसी तारीख का snapshot न मिलना अपने-आप यह साबित नहीं करता कि उस समय वेबसाइट मौजूद नहीं थी।",
note:"वेबसाइट के इतिहास के बारे में निष्कर्ष केवल उपलब्ध प्रमाणों की सीमा में रखें।"
},
{
time:18,k:"07 — संबंधित संस्थाएँ",
title:"साझा विवरण का अर्थ क्या है?",
sub:"संबंध का तथ्य और आरोप अलग बातें हैं",
body:"दो संस्थाओं में समान निदेशक, पता या संपर्क विवरण दिखाई दे तो उस तथ्य को मूल रिकॉर्ड के साथ बताया जा सकता है। केवल समान विवरण से धोखाधड़ी, मिलीभगत या गैरकानूनी गतिविधि का निष्कर्ष नहीं निकलता।",
cards:[
["क्या दिखाएँ?","रिकॉर्ड में दर्ज वास्तविक विवरण।"],
["क्या न मानें?","बिना प्रमाण किसी गलत काम का निष्कर्ष।"]
]
},
{
time:20,k:"08 — आपकी जाँच सूची",
title:"आवेदन करने से पहले",
list:[
"आधिकारिक पोर्टल पर कानूनी नाम जाँचें।",
"CIN या NGO विवरण मूल रिकॉर्ड से मिलाएँ।",
"नियोक्ता और भर्ती आदेश की पुष्टि करें।",
"वेतन, काम और स्थान लिखित में लें।",
"शुल्क या डिपॉजिट की माँग पर सावधानी रखें।",
"दस्तावेज़, ईमेल और रसीदें सुरक्षित रखें।"
]
},
{
time:20,k:"09 — स्रोत और निष्कर्ष",
title:"सवाल पूछें। प्रमाण माँगें।",
sub:"अंतिम निष्कर्ष मूल दस्तावेज़ों पर आधारित हो",
body:"यह वीडियो सार्वजनिक जानकारी समझने और स्वतंत्र सत्यापन के लिए है। इसे किसी संस्था या व्यक्ति के विरुद्ध अंतिम निर्णय न मानें। नए प्रमाण मिलने पर जानकारी को अपडेट करें।",
sources:[
["पूरा समीक्षा लेख",ARTICLE],
["MCA आधिकारिक वेबसाइट","https://www.mca.gov.in/"],
["NGO Darpan","https://ngodarpan.gov.in/"],
["Wayback Machine","https://web.archive.org/"]
]
}
];

let index=0,elapsed=0,playing=true,last=performance.now();
const scene=document.getElementById("scene");
const bar=document.getElementById("bar");
const count=document.getElementById("count");
const playButton=document.getElementById("play");

function safe(s){
return String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function render(){
const s=scenes[index];
let html=`<div class="kicker">${safe(s.k)}</div>
<h1>${safe(s.title)}</h1>`;
if(s.sub)html+=`<h2>${safe(s.sub)}</h2>`;
if(s.body)html+=`<p>${safe(s.body)}</p>`;
if(s.cards)html+=`<div class="cards">${s.cards.map(c=>
`<div class="card"><b>${safe(c[0])}</b><span>${safe(c[1])}</span></div>`
).join("")}</div>`;
if(s.tags)html+=`<div class="tags">${s.tags.map(t=>`<span>${safe(t)}</span>`).join("")}</div>`;
if(s.list)html+=`<ol>${s.list.map(x=>`<li>${safe(x)}</li>`).join("")}</ol>`;
if(s.note)html+=`<div class="note">${safe(s.note)}</div>`;
if(s.sources)html+=`<div class="sources"><h2>स्रोत</h2>${s.sources.map(x=>
`<a href="${safe(x[1])}" target="_blank" rel="noopener">${safe(x[0])} ↗</a>`
).join("")}</div>`;
scene.innerHTML=html;
scene.style.animation="none";
void scene.offsetWidth;
scene.style.animation="show .6s ease";
elapsed=0;
count.textContent=`${index+1}/${scenes.length}`;
bar.style.width="0%";
}

function move(n){
index=(index+n+scenes.length)%scenes.length;
render();
}
document.getElementById("prev").onclick=()=>move(-1);
document.getElementById("next").onclick=()=>move(1);
document.getElementById("restart").onclick=()=>{index=0;render()};
playButton.onclick=()=>{
playing=!playing;
playButton.textContent=playing?"⏸ रोकें":"▶ चलाएँ";
last=performance.now();
};

function tick(now){
const dt=Math.min((now-last)/1000,.1);
last=now;
if(playing){
elapsed+=dt;
bar.style.width=Math.min(100,elapsed/scenes[index].time*100)+"%";
if(elapsed>=scenes[index].time)move(1);
}
requestAnimationFrame(tick);
}
render();
requestAnimationFrame(tick);
</script>
</body>
</html>
