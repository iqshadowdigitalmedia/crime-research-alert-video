<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>डिस्क्लेमर वीडियो</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--accent:#4f7cff;--text:#eee;--muted:#9aa1ad;}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f5f7;--card:#fff;--text:#111;--muted:#666;}}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
h1{font-size:1.2rem;padding:16px;margin:0;}
.wrap{max-width:480px;margin:0 auto;padding:0 12px 40px;}
canvas{width:100%;border-radius:10px;background:#000;display:block;}
.slide{background:var(--card);border-radius:10px;padding:10px;margin:10px 0;}
.slide textarea{width:100%;min-height:70px;background:transparent;color:var(--text);border:1px solid #444;border-radius:6px;padding:8px;font-size:14px;}
.row{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap;}
.row2{display:flex;gap:8px;align-items:center;margin-top:6px;}
.row2 input[type=text]{width:60px;padding:4px;border-radius:4px;border:1px solid #444;background:transparent;color:var(--text);text-align:center;font-size:20px;}
input[type=color]{width:36px;height:30px;border:none;background:none;}
input[type=number]{width:60px;padding:4px;}
button{background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:6px;font-size:14px;}
button.secondary{background:#333;}
button.del{background:#a33;}
button.sticker{background:#2a2d36;padding:6px 8px;font-size:16px;}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;}
label{font-size:12px;color:var(--muted);}
#status{font-size:13px;color:var(--muted);margin-top:8px;}
a#dl{display:none;margin-top:10px;}
</style>
</head>
<body>
<h1>⚖️ डिस्क्लेमर वीडियो जेनरेटर (एनिमेशन सहित)</h1>
<div class="wrap">
<canvas id="cv" width="720" height="1280"></canvas>
<div id="status"></div>
<div class="controls">
<button onclick="preview()">▶ प्रीव्यू</button>
<button class="secondary" onclick="addSlide()">+ नई स्लाइड</button>
<button onclick="exportVideo()">⬇ वीडियो बनाएं</button>
</div>
<a id="dl">वीडियो डाउनलोड करें</a>
<div id="slides"></div>
</div>
<script>
let slides = [
 {text:"डिस्क्लेमर:\nइस चैनल पर साझा की गई जानकारी निर्माता के व्यक्तिगत शोध, सार्वजनिक रूप से उपलब्ध जानकारी और जनहित में जागरूकता फैलाने के उद्देश्य पर आधारित है।", color:"#0a0c12", color2:"#1a1a2e", icon:"⚖️", dur:7},
 {text:"इस चैनल का उद्देश्य किसी भी व्यक्ति, संस्था या संगठन को बदनाम करना अथवा नुकसान पहुँचाना नहीं है।\nदर्शकों से अनुरोध है कि किसी भी संस्था से जुड़ने या भुगतान करने से पहले स्वयं जाँच-पड़ताल अवश्य करें।", color:"#1a1a2e", color2:"#2e1a1a", icon:"ℹ️", dur:8},
 {text:"ठगी हो जाए तो तुरंत\n📞 1930 पर कॉल करें\nया cybercrime.gov.in पर शिकायत दर्ज करें", color:"#0e3a1f", color2:"#1a2e1a", icon:"✅", dur:6},
 {text:"उपयोगी लगे तो चैनल को Subscribe करें\nऔर अपनों के साथ Share करें!", color:"#1a2e5a", color2:"#2e1a5a", icon:"🔔", dur:5}
];
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
function render(){
 const box=document.getElementById('slides'); box.innerHTML='';
 slides.forEach((s,i)=>{
  const d=document.createElement('div'); d.className='slide';
  d.innerHTML=`<textarea onchange="slides[${i}].text=this.value">${s.text}</textarea>
  <div class="row">
   <label>रंग 1</label><input type="color" value="${s.color}" onchange="slides[${i}].color=this.value">
   <label>रंग 2</label><input type="color" value="${s.color2||s.color}" onchange="slides[${i}].color2=this.value">
   <label>सेकंड</label><input type="number" value="${s.dur}" min="1" max="15" onchange="slides[${i}].dur=+this.value">
  </div>
  <div class="row2">
   <label>आइकन</label><input type="text" maxlength="2" value="${s.icon||''}" onchange="slides[${i}].icon=this.value">
   <button class="del" onclick="slides.splice(${i},1);render()">हटाएं</button>
  </div>
  <div class="row" style="margin-top:8px">
   <label>Elements:</label>
   ${['🔒','⚠️','🛡️','📞','✅','❌','💰','📱','👮','🚫'].map(e=>`<button class="sticker" onclick="addSticker(${i},'${e}')">${e}</button>`).join('')}
  </div>
  <div class="row" style="flex-wrap:wrap;gap:4px;margin-top:4px">
   ${(s.stickers||[]).map((st,si)=>`<span style="background:#333;padding:2px 6px;border-radius:6px;font-size:13px">${st.e}<button style="padding:0 4px;margin-left:4px;background:#a33;border-radius:4px" onclick="slides[${i}].stickers.splice(${si},1);render()">x</button></span>`).join('')}
  </div>`;
  box.appendChild(d);
 });
}
function addSlide(){slides.push({text:"नया टेक्स्ट",color:"#1a1a2e",color2:"#3a3a6e",icon:"ℹ️",dur:4,stickers:[]}); render();}
function addSticker(i,e){
 if(!slides[i].stickers) slides[i].stickers=[];
 if(slides[i].stickers.length>=6){ alert("ज़्यादा से ज़्यादा 6 elements"); return; }
 const positions=[[0.15,0.12],[0.85,0.12],[0.15,0.88],[0.85,0.88],[0.15,0.5],[0.85,0.5]];
 const pos=positions[slides[i].stickers.length];
 slides[i].stickers.push({e, x:pos[0], y:pos[1]});
 render();
}

function ease(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function drawSlide(s,p){
 p = p===undefined?1:p;
 const FADE=0.15;
 let alpha=1, slideOff=0, iconScale=1;
 if(p<FADE){ const t=ease(p/FADE); alpha=t; slideOff=(1-t)*60; iconScale=0.6+0.4*t; }
 else if(p>1-FADE){ const t=ease((1-p)/FADE); alpha=t; }
 const g=ctx.createLinearGradient(0,0,0,cv.height);
 g.addColorStop(0,s.color); g.addColorStop(1,s.color2||s.color);
 ctx.fillStyle=g; ctx.fillRect(0,0,cv.width,cv.height);
 ctx.strokeStyle="rgba(255,255,255,0.35)"; ctx.lineWidth=6;
 ctx.strokeRect(18,18,cv.width-36,cv.height-36);
 ctx.globalAlpha=alpha;
 if(s.icon){
  ctx.save();
  ctx.translate(cv.width/2,200);
  ctx.scale(iconScale,iconScale);
  ctx.font="90px sans-serif"; ctx.textAlign="center"; ctx.fillText(s.icon,0,0);
  ctx.restore();
 }
 if(s.stickers){
  ctx.font="54px sans-serif"; ctx.textAlign="center";
  s.stickers.forEach(st=>{
   ctx.save();
   ctx.globalAlpha=alpha*0.85;
   ctx.translate(st.x*cv.width, st.y*cv.height);
   ctx.scale(iconScale,iconScale);
   ctx.fillText(st.e,0,0);
   ctx.restore();
  });
  ctx.globalAlpha=alpha;
 }
 ctx.fillStyle="#fff"; ctx.font="bold 40px sans-serif"; ctx.textAlign="center";
 const maxW=cv.width-100;
 let lines=[];
 s.text.split("\n").forEach(para=>{
  const words=para.split(" "); let cur="";
  words.forEach(w=>{
   const test=cur?cur+" "+w:w;
   if(ctx.measureText(test).width>maxW && cur){ lines.push(cur); cur=w; }
   else cur=test;
  });
  lines.push(cur);
 });
 const lh=54; const startY=cv.height/2 - (lines.length-1)*lh/2 + 60;
 lines.forEach((l,i)=>{
  ctx.shadowColor="rgba(0,0,0,0.6)"; ctx.shadowBlur=8;
  ctx.fillText(l, cv.width/2, startY+i*lh+slideOff, maxW);
 });
 ctx.shadowBlur=0; ctx.globalAlpha=1;
}
async function playAll(onFrame){
 const fps=30;
 for(const s of slides){
  const totalFrames=Math.round(s.dur*fps);
  for(let f=0; f<totalFrames; f++){
   drawSlide(s, f/totalFrames);
   if(onFrame) await onFrame();
   else await new Promise(r=>setTimeout(r,1000/fps));
  }
 }
}
async function preview(){ await playAll(); }
async function exportVideo(){
 const status=document.getElementById('status');
 const stream=cv.captureStream(30);
 let rec, chunks=[];
 const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
 rec=new MediaRecorder(stream,{mimeType:mime});
 rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=()=>{
  const blob=new Blob(chunks,{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.getElementById('dl');
  a.href=url; a.download="disclaimer-video.webm"; a.style.display="inline-block"; a.textContent="⬇ वीडियो डाउनलोड करें (.webm)";
  status.textContent="तैयार है! नीचे डाउनलोड लिंक दबाएं। (इसमें आवाज़ नहीं है — CapCut/VN में आवाज़+म्यूज़िक जोड़ें)";
 };
 rec.start();
 status.textContent="बन रहा है...";
 await playAll(()=>new Promise(r=>setTimeout(r,1000/30)));
 rec.stop();
}
render(); drawSlide(slides[0],1);
</script>
</body>
</html>
